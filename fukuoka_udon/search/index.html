var map=L.map('map').setView([33.58689,130.39704],11);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);

var baseLayer=L.layerGroup().addTo(map), hiLayer=L.layerGroup().addTo(map);
var activeWards={}; Object.keys(wardcolor).forEach(w=>activeWards[w]=true);

function drawBase(){
  baseLayer.clearLayers();
  shops.forEach(function(s){
    if(!activeWards[s.ward]) return;
    L.circleMarker([s.lat,s.lon],{radius:4,weight:0,fillColor:wardcolor[s.ward]||'#888',fillOpacity:.55})
     .bindPopup('<b>'+s.name+'</b><br>'+s.ward+'<br>'+s.address).addTo(baseLayer);
  });
}
function highlight(list,label){
  hiLayer.clearLayers();
  var b=[];
  list.forEach(function(s){
    L.circleMarker([s.lat,s.lon],{radius:9,color:'#7a0010',weight:1.5,fillColor:'#e31a1c',fillOpacity:.95})
     .bindPopup('<b>'+s.name+'</b><br>'+s.ward+'<br>'+s.address)
     .bindTooltip('<span class="lbl">'+s.name+'</span>',{permanent:true,direction:'right',offset:[8,0]}).addTo(hiLayer);
    b.push([s.lat,s.lon]);
  });
  document.getElementById('stat').textContent=label+' : '+list.length+' 店';
  if(b.length) map.fitBounds(b,{padding:[40,40],maxZoom:15});
}
function byNames(names){var set={};names.forEach(n=>set[n]=1);return shops.filter(s=>set[s.name]);}

// examples dropdown
var sel=document.getElementById('ex');
examples.forEach(function(e,i){var o=document.createElement('option');o.value=i;o.textContent=e.q;sel.appendChild(o);});
sel.addEventListener('change',function(){
  if(sel.value===''){hiLayer.clearLayers();document.getElementById('stat').textContent='';return;}
  var e=examples[+sel.value]; highlight(byNames(e.names),'RAM検索: '+e.q);
});
// keyword
document.getElementById('kw').addEventListener('input',function(e){
  var k=e.target.value.trim(); if(!k){hiLayer.clearLayers();document.getElementById('stat').textContent='';return;}
  sel.value='';
  highlight(shops.filter(s=>s.name.indexOf(k)>=0||s.address.indexOf(k)>=0),'キーワード「'+k+'」');
});
// wards
var wd=document.getElementById('wards');
Object.keys(wardcolor).forEach(function(w){
  var cnt=shops.filter(s=>s.ward===w).length;
  var row=document.createElement('label'); row.className='wardrow';
  row.innerHTML='<input type="checkbox" checked> <i style="background:'+wardcolor[w]+'"></i>'+w+' ('+cnt+')';
  row.querySelector('input').addEventListener('change',function(ev){activeWards[w]=ev.target.checked;drawBase();});
  wd.appendChild(row);
});
document.getElementById('reset').addEventListener('click',function(){
  Object.keys(activeWards).forEach(w=>activeWards[w]=true);
  document.querySelectorAll('#wards input').forEach(c=>c.checked=true);
  document.getElementById('kw').value=''; sel.value='';
  hiLayer.clearLayers(); document.getElementById('stat').textContent=''; drawBase();
  map.setView([33.58689,130.39704],11);
});
drawBase();
